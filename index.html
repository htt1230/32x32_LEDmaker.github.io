<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>32×32 ドット絵ペイントツール</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f4f7fb;
			--panel: rgba(255, 255, 255, 0.92);
			--panel-border: rgba(148, 163, 184, 0.24);
			--text: #0f172a;
			--muted: #64748b;
			--accent: #2563eb;
			--accent-strong: #1d4ed8;
			--danger: #ef4444;
			--shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			min-height: 100%;
			font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
			background:
				radial-gradient(circle at top left, rgba(37, 99, 235, 0.09), transparent 28%),
				radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.08), transparent 26%),
				linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
			color: var(--text);
		}

		body {
			padding: 24px;
		}

		.app {
			max-width: 1500px;
			margin: 0 auto;
			display: grid;
			grid-template-columns: minmax(320px, 1.1fr) minmax(320px, 0.9fr);
			gap: 20px;
			align-items: start;
		}

		.hero {
			grid-column: 1 / -1;
			display: flex;
			justify-content: space-between;
			align-items: end;
			gap: 16px;
			padding: 8px 4px 0;
		}

		.title {
			margin: 0;
			font-size: clamp(2rem, 4vw, 3.6rem);
			letter-spacing: 0.04em;
			line-height: 1.05;
		}

		.subtitle {
			margin: 8px 0 0;
			color: var(--muted);
			font-size: 0.98rem;
			line-height: 1.7;
			max-width: 60ch;
		}

		.card {
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 24px;
			box-shadow: var(--shadow);
			backdrop-filter: blur(16px);
			overflow: hidden;
		}

		.card-header {
			padding: 18px 20px 0;
		}

		.card-title {
			margin: 0;
			font-size: 1.05rem;
			color: #f8fafc;
		}

		.card-body {
			padding: 18px 20px 20px;
		}

		.toolbar {
			display: grid;
			gap: 14px;
		}

		.toolbar-row {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
		}

		.section-label {
			display: block;
			margin-bottom: 8px;
			color: var(--muted);
			font-size: 0.88rem;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}

		.button {
			appearance: none;
			border: 1px solid rgba(148, 163, 184, 0.34);
			background: #ffffff;
			color: var(--text);
			border-radius: 14px;
			padding: 10px 14px;
			font-size: 0.95rem;
			cursor: pointer;
			transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, opacity 120ms ease;
		}

		.button:hover {
			transform: translateY(-1px);
			border-color: rgba(37, 99, 235, 0.55);
			box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
		}

		.button:active {
			transform: translateY(0);
		}

		.button.primary {
			background: linear-gradient(135deg, var(--accent-strong), var(--accent));
			border-color: transparent;
			color: #ffffff;
			font-weight: 700;
		}

		.button.danger {
			background: rgba(239, 68, 68, 0.08);
			border-color: rgba(239, 68, 68, 0.28);
			color: #b91c1c;
		}

		.button.active {
			border-color: rgba(37, 99, 235, 0.75);
			box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12) inset;
		}

		.color-chip {
			width: 40px;
			height: 40px;
			padding: 0;
			border-radius: 12px;
			border: 1px solid rgba(15, 23, 42, 0.12);
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
		}

		.color-picker {
			width: 54px;
			height: 42px;
			border: none;
			padding: 0;
			background: transparent;
			cursor: pointer;
		}

		.canvas-wrap {
			display: grid;
			gap: 14px;
			justify-items: center;
		}

		.canvas-frame {
			width: min(92vw, 760px);
			aspect-ratio: 1;
			padding: 16px;
			border-radius: 28px;
			background: linear-gradient(145deg, #ffffff, #eef3f9);
			border: 1px solid rgba(148, 163, 184, 0.28);
			box-shadow: var(--shadow);
			position: relative;
		}

		.canvas-shell {
			width: 100%;
			height: 100%;
			border-radius: 20px;
			padding: 12px;
			background: #ffffff;
			border: 1px solid rgba(148, 163, 184, 0.18);
		}

		canvas {
			width: 100%;
			height: 100%;
			display: block;
			cursor: crosshair;
			touch-action: none;
			border-radius: 10px;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			background-color: #000;
		}

		canvas.grid-on {
			background-image:
				repeating-linear-gradient(to right, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px calc(100% / 32)),
				repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px calc(100% / 32));
		}

		.canvas-meta {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			width: min(92vw, 760px);
			color: var(--muted);
			font-size: 0.92rem;
		}

		.grid-toggle {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			user-select: none;
		}

		.grid-toggle input {
			width: 16px;
			height: 16px;
			accent-color: var(--accent);
		}

		.output-box {
			display: grid;
			gap: 12px;
		}

		textarea {
			width: 100%;
			min-height: 520px;
			resize: vertical;
			border: 1px solid rgba(148, 163, 184, 0.24);
			border-radius: 18px;
			background: #ffffff;
			color: #0f172a;
			padding: 16px;
			font: 0.92rem/1.6 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
			outline: none;
		}

		textarea:focus {
			border-color: rgba(37, 99, 235, 0.62);
			box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
		}

		.hint {
			color: var(--muted);
			font-size: 0.9rem;
			line-height: 1.6;
		}

		.status {
			min-height: 1.4em;
			color: #334155;
			font-size: 0.92rem;
		}

		@media (max-width: 1100px) {
			.app {
				grid-template-columns: 1fr;
			}

			textarea {
				min-height: 360px;
			}
		}
	</style>
</head>
<body>
	<main class="app">
		<section class="hero">
			<div>
				<h1 class="title">32×32 ドット絵ペイントツール</h1>
				<p class="subtitle">ブラウザ上で32×32ピクセルの画像を描き、CircuitPythonでそのまま使える Python 二次元配列としてワンクリックでコピーできます。</p>
			</div>
		</section>

		<section class="card">
			<div class="card-header">
				<h2 class="card-title">描画ツール</h2>
			</div>
			<div class="card-body toolbar">
				<div>
					<span class="section-label">カラー選択</span>
					<div class="toolbar-row">
						<input id="colorPicker" class="color-picker" type="color" value="#ff0000" aria-label="カラーピッカー" />
						<button class="button" id="eraserButton" type="button">消しゴム</button>
						<button class="button danger" id="clearButton" type="button">全消去</button>
					</div>
				</div>

				<div>
					<span class="section-label">プリセットパレット</span>
					<div class="toolbar-row" id="paletteButtons"></div>
				</div>

				<div>
					<span class="section-label">現在のブラシ</span>
					<div class="toolbar-row">
						<div id="currentColorSwatch" class="color-chip" title="現在の色"></div>
						<button class="button" id="paintModeButton" type="button">描画モード</button>
					</div>
				</div>

				<div class="hint">
					マウスのクリックとドラッグで連続描画できます。消しゴムは黒（#000000）で塗り直す動作です。出力欄は32行×32列の 0xRRGGBB 形式です。
				</div>
			</div>
		</section>

		<section class="canvas-wrap">
			<div class="canvas-frame">
				<div class="canvas-shell">
					<canvas id="paintCanvas" width="32" height="32" aria-label="32×32ドット絵キャンバス"></canvas>
				</div>
			</div>
			<div class="canvas-meta">
				<span>左ボタンで描画 / ドラッグ対応</span>
				<label class="grid-toggle" for="gridToggle">
					<input id="gridToggle" type="checkbox" checked />
					グリッド表示
				</label>
			</div>
		</section>

		<section class="card">
			<div class="card-header">
				<h2 class="card-title">CircuitPython 入出力</h2>
			</div>
			<div class="card-body output-box">
				<textarea id="outputCode" aria-label="Pythonコード入出力"></textarea>
				<div class="toolbar-row">
					<button class="button primary" id="copyButton" type="button">クリップボードにコピー</button>
					<button class="button" id="applyButton" type="button">配列を反映</button>
					<button class="button" id="refreshButton" type="button">出力を再生成</button>
				</div>
				<div id="status" class="status" aria-live="polite"></div>
			</div>
		</section>
	</main>

	<script>
		const SIZE = 32;
		const palette = [
			["#000000", "黒"],
			["#ffffff", "白"],
			["#ff0000", "赤"],
			["#00ff00", "緑"],
			["#0000ff", "青"],
			["#ffff00", "黄"],
			["#00ffff", "シアン"],
			["#ff00ff", "マゼンタ"],
			["#ffa500", "オレンジ"],
			["#8b5cf6", "紫"],
		];

		const canvas = document.getElementById("paintCanvas");
		const ctx = canvas.getContext("2d");
		const colorPicker = document.getElementById("colorPicker");
		const eraserButton = document.getElementById("eraserButton");
		const clearButton = document.getElementById("clearButton");
		const copyButton = document.getElementById("copyButton");
		const applyButton = document.getElementById("applyButton");
		const refreshButton = document.getElementById("refreshButton");
		const outputCode = document.getElementById("outputCode");
		const status = document.getElementById("status");
		const currentColorSwatch = document.getElementById("currentColorSwatch");
		const paintModeButton = document.getElementById("paintModeButton");
		const paletteButtons = document.getElementById("paletteButtons");
		const gridToggle = document.getElementById("gridToggle");

		const pixels = Array.from({ length: SIZE }, () => Array(SIZE).fill("#000000"));

		let brushColor = colorPicker.value;
		let eraseMode = false;
		let isDrawing = false;
		let lastCell = null;
		let gridVisible = true;

		function toHexColor(value) {
			return "0x" + value.slice(1).toUpperCase();
		}

		function setStatus(message) {
			status.textContent = message;
		}

		function updateBrushUI() {
			currentColorSwatch.style.background = eraseMode ? "#000000" : brushColor;
			currentColorSwatch.style.boxShadow = eraseMode
				? "inset 0 0 0 2px rgba(255,255,255,0.12)"
				: "inset 0 0 0 2px rgba(255,255,255,0.18)";
			colorPicker.value = brushColor;
			eraserButton.classList.toggle("active", eraseMode);
			paintModeButton.textContent = eraseMode ? "消しゴム中" : "描画モード";
			paintModeButton.classList.toggle("active", !eraseMode);
		}

		function updateGridVisibility() {
			canvas.classList.toggle("grid-on", gridVisible);
			gridToggle.checked = gridVisible;
		}

		function renderCanvas() {
			for (let y = 0; y < SIZE; y++) {
				for (let x = 0; x < SIZE; x++) {
					ctx.fillStyle = pixels[y][x];
					ctx.fillRect(x, y, 1, 1);
				}
			}
			updateOutput();
		}

		function buildPythonOutput() {
			const rows = pixels.map((row) => {
				const values = row.map((color) => toHexColor(color)).join(", ");
				return `    [${values}],`;
			});
			return [`# 32x32 Image Data`, `IMAGE_DATA = [`, ...rows, `]`].join("\n");
		}

		function parsePythonOutput(text) {
			const matches = text.match(/0x[0-9a-fA-F]{6}/g) || [];
			if (matches.length !== SIZE * SIZE) {
				throw new Error(`32×32分の色データが必要です。見つかった値は ${matches.length} 個です。`);
			}

			const nextPixels = [];
			for (let index = 0; index < matches.length; index += SIZE) {
				const row = matches.slice(index, index + SIZE).map((value) => `#${value.slice(2)}`.toLowerCase());
				nextPixels.push(row);
			}
			return nextPixels;
		}

		function applyPythonInput() {
			try {
				const nextPixels = parsePythonOutput(outputCode.value);
				for (let y = 0; y < SIZE; y++) {
					for (let x = 0; x < SIZE; x++) {
						pixels[y][x] = nextPixels[y][x];
					}
				}
				renderCanvas();
				setStatus("Python配列をキャンバスに反映しました。");
			} catch (error) {
				setStatus(error instanceof Error ? error.message : "配列の読み込みに失敗しました。");
			}
		}

		function updateOutput() {
			outputCode.value = buildPythonOutput();
		}

		function setPixel(cellX, cellY, color) {
			if (cellX < 0 || cellX >= SIZE || cellY < 0 || cellY >= SIZE) {
				return;
			}
			pixels[cellY][cellX] = color;
			ctx.fillStyle = color;
			ctx.fillRect(cellX, cellY, 1, 1);
			updateOutput();
		}

		function drawLine(startCell, endCell, color) {
			let x0 = startCell.x;
			let y0 = startCell.y;
			const x1 = endCell.x;
			const y1 = endCell.y;

			const dx = Math.abs(x1 - x0);
			const dy = Math.abs(y1 - y0);
			const stepX = x0 < x1 ? 1 : -1;
			const stepY = y0 < y1 ? 1 : -1;
			let error = dx - dy;

			while (true) {
				setPixel(x0, y0, color);
				if (x0 === x1 && y0 === y1) {
					break;
				}
				const doubledError = error * 2;
				if (doubledError > -dy) {
					error -= dy;
					x0 += stepX;
				}
				if (doubledError < dx) {
					error += dx;
					y0 += stepY;
				}
			}
		}

		function getCellFromEvent(event) {
			const rect = canvas.getBoundingClientRect();
			const x = Math.floor(((event.clientX - rect.left) / rect.width) * SIZE);
			const y = Math.floor(((event.clientY - rect.top) / rect.height) * SIZE);
			return { x, y };
		}

		function paintAtEvent(event) {
			const { x, y } = getCellFromEvent(event);
			if (lastCell && lastCell.x === x && lastCell.y === y) {
				return;
			}
			const nextCell = { x, y };
			const color = eraseMode ? "#000000" : brushColor;
			if (lastCell) {
				drawLine(lastCell, nextCell, color);
			} else {
				setPixel(x, y, color);
			}
			lastCell = nextCell;
		}

		function clearCanvas() {
			for (let y = 0; y < SIZE; y++) {
				for (let x = 0; x < SIZE; x++) {
					pixels[y][x] = "#000000";
				}
			}
			renderCanvas();
			setStatus("キャンバスを黒でリセットしました。");
		}

		function setBrushColor(color) {
			brushColor = color;
			eraseMode = false;
			updateBrushUI();
			setStatus(`ブラシ色を ${color.toUpperCase()} に変更しました。`);
		}

		function setEraserMode(enabled) {
			eraseMode = enabled;
			updateBrushUI();
			setStatus(enabled ? "消しゴムモードに切り替えました。" : "描画モードに戻しました。");
		}

		function copyOutput() {
			const text = buildPythonOutput();
			outputCode.value = text;
			navigator.clipboard.writeText(text).then(() => {
				setStatus("Pythonコードをクリップボードにコピーしました。");
			}).catch(() => {
				outputCode.focus();
				outputCode.select();
				const copied = document.execCommand("copy");
				setStatus(copied ? "Pythonコードをクリップボードにコピーしました。" : "コピーに失敗しました。テキストエリアから手動でコピーしてください。");
			});
		}

		function buildPaletteButtons() {
			paletteButtons.innerHTML = "";
			for (const [color, label] of palette) {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "button color-chip";
				button.style.background = color;
				button.title = label;
				button.setAttribute("aria-label", label);
				button.addEventListener("click", () => setBrushColor(color));
				paletteButtons.appendChild(button);
			}
		}

		canvas.addEventListener("pointerdown", (event) => {
			if (event.button !== 0) {
				return;
			}
			canvas.setPointerCapture(event.pointerId);
			isDrawing = true;
			paintAtEvent(event);
		});

		canvas.addEventListener("pointermove", (event) => {
			if (!isDrawing) {
				return;
			}
			paintAtEvent(event);
		});

		canvas.addEventListener("pointerup", () => {
			isDrawing = false;
			lastCell = null;
		});

		canvas.addEventListener("pointercancel", () => {
			isDrawing = false;
			lastCell = null;
		});

		canvas.addEventListener("pointerleave", () => {
			if (!isDrawing) {
				lastCell = null;
			}
		});

		colorPicker.addEventListener("input", (event) => setBrushColor(event.target.value));
		eraserButton.addEventListener("click", () => setEraserMode(true));
		paintModeButton.addEventListener("click", () => setEraserMode(false));
		clearButton.addEventListener("click", clearCanvas);
		copyButton.addEventListener("click", copyOutput);
		applyButton.addEventListener("click", applyPythonInput);
		refreshButton.addEventListener("click", () => {
			updateOutput();
			setStatus("出力テキストを再生成しました。");
		});
		gridToggle.addEventListener("change", (event) => {
			gridVisible = event.target.checked;
			updateGridVisibility();
			setStatus(gridVisible ? "グリッド表示をONにしました。" : "グリッド表示をOFFにしました。");
		});

		buildPaletteButtons();
		updateBrushUI();
		updateGridVisibility();
		renderCanvas();
		setStatus("準備完了。キャンバスに描画できます。");
	</script>
</body>
</html>
